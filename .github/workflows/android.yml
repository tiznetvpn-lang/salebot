name: Android APK

# ساخت APK امضاشدهٔ اپ «تیزنت». خروجی همیشه به‌صورت Artifact و — اگر روی تگ اجرا شود —
# به‌عنوان Asset ریلیز گیت‌هاب در دسترس است تا نصب/آپدیت بدون Android Studio ممکن باشد.

on:
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      - 'package.json'

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build release APK
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        id: apk
        run: |
          set -euo pipefail
          SRC=android/app/build/outputs/apk/release/app-release.apk
          test -f "$SRC"
          mkdir -p out
          NAME="tiznet-app-$(grep -E '^tiznet.versionName=' android/gradle.properties | cut -d= -f2).apk"
          cp "$SRC" "out/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiznet-apk
          path: out/*.apk
          retention-days: 30

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          name: تیزنت اپ ${{ github.ref_name }}
          body: |
            APK امضاشدهٔ اپ اندروید «تیزنت» برای اتصال مستقیم به همین سرور.
            نصب: فایل را روی گوشی باز کنید و اجازهٔ نصب از منابع ناشناس را بدهید.
