name: Android APK

# ساخت APK امضاشدهٔ اپ «تیزنت». خروجی همیشه به‌صورت Artifact و — اگر روی تگ اجرا شود —
# به‌عنوان Asset ریلیز گیت‌هاب در دسترس است تا نصب/آپدیت بدون Android Studio ممکن باشد.
#
# نکته: این workflow عمداً به اکشن‌های شخص‌ثالث وابسته نیست؛ SDK اندروید از تصویر خود
# رانر و Gradle از توزیع رسمی گرفته می‌شود تا شکست بیرونی، ساخت را نخواباند.

on:
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']
    tags: ['app-v*']

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "Android SDK روی تصویر رانر نبود؛ نسخهٔ رسمی دانلود می‌شود."
            SDK="$HOME/android-sdk"
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/clt.zip
            unzip -q /tmp/clt.zip -d /tmp/clt
            mv /tmp/clt/cmdline-tools "$SDK/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDK=$SDK" >> "$GITHUB_ENV"

      - name: Install platform 34 and build-tools
        run: |
          set -euo pipefail
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /tmp/sdk.log 2>&1 \
            || { echo "sdkmanager failed"; tail -n 40 /tmp/sdk.log; exit 1; }

      - name: Install Gradle
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"
          /opt/gradle-8.7/bin/gradle --version

      - name: Build release APK
        working-directory: android
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace --console=plain 2>&1 | tee /tmp/build.log

      - name: Collect APK
        id: apk
        run: |
          set -euo pipefail
          SRC=android/app/build/outputs/apk/release/app-release.apk
          test -f "$SRC"
          mkdir -p out
          NAME="tiznet-app-$(grep -E '^tiznet.versionName=' android/gradle.properties | cut -d= -f2).apk"
          cp "$SRC" "out/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh out

      # اثبات قابل‌بررسی: همان مجوزها و سرویس/گیرنده‌هایی که در manifest است، واقعاً داخل APK است.
      - name: Verify APK permissions
        run: |
          set -euo pipefail
          APK="out/$(ls out | head -1)"
          AAPT="$SDK/build-tools/34.0.0/aapt"
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -E "^package:|^sdkVersion|^targetSdkVersion|uses-permission" || true
          echo '--- services/receivers ---'
          XML="$("$AAPT" dump xmltree "$APK" AndroidManifest.xml)"
          echo "$XML" | grep -E "E: (service|receiver)|A: android:name|foregroundServiceType|SMS_RECEIVED" | head -40 || true
          # اگر مجوزی داخل APK نباشد، ساخت شکست می‌خورد: سبز بودن CI یعنی مجوزها واقعاً هست.
          for p in RECEIVE_SMS POST_NOTIFICATIONS REQUEST_IGNORE_BATTERY_OPTIMIZATIONS \
                   FOREGROUND_SERVICE FOREGROUND_SERVICE_DATA_SYNC RECEIVE_BOOT_COMPLETED; do
            echo "$BADGING" | grep -q "android.permission.$p" || { echo "❌ مجوز $p داخل APK نیست"; exit 1; }
          done
          echo "$XML" | grep -q "GuardService" || { echo "❌ سرویس همیشه‌فعال داخل APK نیست"; exit 1; }
          # aapt مقدار enum را عددی چاپ می‌کند (dataSync = 0x1)، پس همان نام ویژگی را می‌سنجیم.
          echo "$XML" | grep -q "foregroundServiceType" || { echo "❌ foregroundServiceType داخل APK نیست"; exit 1; }
          echo "$XML" | grep -q "SMS_RECEIVED" || { echo "❌ گیرندهٔ پیامک داخل APK نیست"; exit 1; }
          echo "✅ مجوز پیامک، اعلان، معافیت باتری، سرویس پس‌زمینه، بوت و گیرندهٔ پیامک داخل APK تأیید شد"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiznet-apk
          path: out/*.apk
          retention-days: 30

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          name: تیزنت اپ ${{ github.ref_name }}
          body: |
            APK امضاشدهٔ اپ اندروید «تیزنت» برای اتصال مستقیم به همین سرور.
            نصب: فایل را روی گوشی باز کنید و اجازهٔ نصب از منابع ناشناس را بدهید.

      # چون لاگ اکشن‌ها از بیرون همیشه خواندنی نیست، خطای ساخت به‌صورت کامنت روی
      # همان کامیت نوشته می‌شود تا بدون باز کردن مرورگر هم قابل بررسی باشد.
      - name: Report failure on the commit
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### ❌ ساخت APK ناموفق بود"
            echo
            echo "**خطاهای کامپایل:**"
            echo '```'
            grep -E "^e: |^> Task .*FAILED|error:" /tmp/build.log 2>/dev/null | head -n 40 || true
            echo '```'
            echo
            echo "**بخش What went wrong:**"
            echo '```'
            sed -n '/What went wrong/,/Try:/p' /tmp/build.log 2>/dev/null | head -n 40 || true
            echo '```'
            echo
            echo "**بازرسی APK:**"
            echo '```'
            APK="out/$(ls out 2>/dev/null | head -1)"
            if [ -f "$APK" ]; then
              "$SDK/build-tools/34.0.0/aapt" dump badging "$APK" 2>&1 | grep -E "^package:|uses-permission|^sdkVersion|^targetSdkVersion" || true
              echo '--- manifest ---'
              "$SDK/build-tools/34.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml 2>&1 | grep -E "E: (service|receiver)|GuardService|BootReceiver|foregroundServiceType|SMS_RECEIVED" | head -n 20 || true
            else
              echo "APK ساخته نشد؛ بازرسی ممکن نیست."
              ls -la out 2>/dev/null || true
            fi
            echo '```'
          } > /tmp/digest.md
          gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -F "body=@/tmp/digest.md" > /dev/null 2>&1 || true
