# نمونهٔ شروع با HTTP؛ پس از فعال‌شدن DNS و تأیید پورت 80، Certbot آن را HTTPS می‌کند.
# جای‌نگهدار __DOMAIN__ را install.sh/update.sh با دامنهٔ واقعی جایگزین می‌کند.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # access log خاموش است تا query stringهای حساس احتمالی در لاگ ذخیره نشوند.
    access_log off;
    client_max_body_size 55m;
    client_body_timeout 120s;

    # وبهوک از CLI امن scripts/setup-webhook.mjs تنظیم می‌شود؛ این URLهای دارای secret
    # را از اینترنت پنهان می‌کنیم و در access log هم ثبت نمی‌کنیم.
    location = /setup {
        access_log off;
        return 404;
    }
    location = /diag {
        access_log off;
        return 404;
    }

    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:3000/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_request_buffering off;
    }
}
